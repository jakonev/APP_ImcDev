name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. Baixa o código (Atualizado para v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura a versão correta do Java (Necessária para o ambiente Android Studio/Flutter)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Instala e configura as dependências nativas (CocoaPods)
      - name: Install Pods
        run: |
          flutter pub get
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      # 5. Gera o build limpo do iOS sem assinatura
      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      # 6. Salva o arquivo .ipa nos artefatos
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build
          path: build/ios/iphoneos/app.ipa
